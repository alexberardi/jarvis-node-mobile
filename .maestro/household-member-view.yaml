appId: com.jarvis.nodemobile
name: Household as a member and as a power user
# What the seeded non-admin roles see of the household (read only, nothing changes):
# - the member (EMAIL_MEMBER, Sam) sees the household and its role in the household list,
#   and the Household tab's Jarvis section read only (no save);
# - the power user (EMAIL_POWER, Robin) opens the Household tab's sections, can manage
#   invite codes, and has none of the admin controls (save name, role menus, remove
#   member); the watches and errand-autonomy switches show, disabled.
# The superuser first renames the household back if an earlier run left it renamed
# (subflows/reset-household-name.yaml): the member can't.
tags:
  - settings
  - household
  - e2e
env:
  EMAIL: "test@jarvisautomation.io"
  EMAIL_MEMBER: "sam@jarvisautomation.io"
  EMAIL_POWER: "robin@jarvisautomation.io"
  PASSWORD: "DevPass123!"
---
- launchApp:
    clearState: true
- runFlow: subflows/login.yaml
- runFlow: subflows/reset-household-name.yaml

# Member
- launchApp:
    clearState: true
- runFlow:
    file: subflows/login-as.yaml
    env:
      LOGIN_EMAIL: ${EMAIL_MEMBER}
- runFlow: subflows/open-households.yaml
- scrollUntilVisible:
    element:
      id: "household-role-.*"
    direction: DOWN
- assertVisible:
    text: "Avery Household"
- assertVisible:
    id: "household-role-.*"
    text: "member"
- tapOn:
    id: "settings-close"
- runFlow:
    file: subflows/open-household-section.yaml
    env:
      ENTRY: "household-tile-jarvis"
      WAIT_ID: "household-persona-input"
- assertNotVisible:
    id: "household-save-persona"
- back

# Power user
- launchApp:
    clearState: true
- runFlow:
    file: subflows/login-as.yaml
    env:
      LOGIN_EMAIL: ${EMAIL_POWER}
- runFlow:
    file: subflows/open-household-section.yaml
    env:
      ENTRY: "household-home-row-home"
      WAIT_ID: "household-name-input"
- assertNotVisible:
    id: "household-save-name"
- back
- runFlow:
    file: subflows/open-household-section.yaml
    env:
      ENTRY: "household-tile-members"
      WAIT_ID: "member-row-.*"
# Center the row: found at the bottom edge, its role chip can still be below the fold.
- scrollUntilVisible:
    element:
      id: "member-row-${EMAIL_MEMBER}"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "member-role-.*"
    childOf:
      id: "member-row-${EMAIL_MEMBER}"
- assertNotVisible:
    id: "member-role-chip-.*"
- assertNotVisible:
    id: "member-remove-.*"
- scrollUntilVisible:
    element:
      id: "invite-create-open"
    direction: DOWN
- back

# Jarvis: no persona save; watches & errands shown read-only (only an admin can change them)
- runFlow:
    file: subflows/open-household-section.yaml
    env:
      ENTRY: "household-tile-jarvis"
      WAIT_ID: "household-persona-input"
- assertNotVisible:
    id: "household-save-persona"
- scrollUntilVisible:
    element:
      id: "household-watches-toggle"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "household-watches-toggle"
    enabled: false
- assertVisible:
    id: "household-errands-autonomy-toggle"
    enabled: false
- assertVisible:
    id: "household-watches-admin-note"
