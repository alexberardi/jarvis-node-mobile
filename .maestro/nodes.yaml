appId: com.jarvis.nodemobile
name: Nodes, list, node cards, hardware and settings
# Household › Nodes (src/screens/Nodes/): both seeded nodes are listed; dev-kitchen's
# screen shows its cards; (when the node is not a docker install) Hardware & upkeep opens;
# on a phone without the node's K2 key (clearState wipes it), the key banner opens settings,
# which ask for one instead of loading. The key is not generated: that needs a live node to take it.
# Packages is not opened: packages are not tested (user, 2026-10-17).
# Rename is not covered: the app has no rename for a node.
tags:
  - nodes
  - e2e
env:
  EMAIL: "test@jarvisautomation.io"
  PASSWORD: "DevPass123!"
  # scripts/seed-dev.py's fixed node ids: dev-kitchen and dev-living-room.
  NODE_ID: "5eed0000-0000-4000-8000-00000000a0de"
  LIVING_NODE_ID: "5eed0000-0000-4000-8000-00000000117e"
---
- launchApp:
    clearState: true
- runFlow: subflows/login.yaml
- tapOn:
    id: "tab-household"
- tapOn:
    id: "household-tile-nodes"
- extendedWaitUntil:
    visible:
      id: "node-card-${NODE_ID}"
    timeout: 20000
- assertVisible:
    id: "node-card-${LIVING_NODE_ID}"
- assertVisible:
    id: "node-add-fab"

# Node screen
- tapOn:
    id: "node-card-${NODE_ID}"
- extendedWaitUntil:
    visible:
      id: "node-card-packages"
    timeout: 15000
- assertVisible:
    id: "node-kind-icon"
- scrollUntilVisible:
    element:
      id: "node-card-forge-test"
    direction: DOWN

# Hardware & upkeep (every install but docker)
- runFlow:
    when:
      visible:
        id: "node-card-hardware"
    commands:
      - tapOn:
          id: "node-card-hardware"
      - extendedWaitUntil:
          visible:
            id: "hardware-tab"
          timeout: 10000
      - scrollUntilVisible:
          element:
            text: "Device Info"
          direction: DOWN
      - scrollUntilVisible:
          element:
            id: "node-id-copy-btn"
          direction: DOWN
      - back
      - extendedWaitUntil:
          visible:
            id: "node-card-hardware"
          timeout: 10000

# Settings: the key banner shows when the node wants a key this phone doesn't hold.
- scrollUntilVisible:
    element:
      id: "node-card-packages"
    direction: UP
- runFlow:
    when:
      visible:
        id: "node-key-banner"
    commands:
      - tapOn:
          id: "node-key-banner"
      - extendedWaitUntil:
          visible:
            id: "node-settings-needs-k2"
          timeout: 15000
      - assertVisible:
          text: "Encryption Key Required"
      - back
      - extendedWaitUntil:
          visible:
            id: "node-card-packages"
          timeout: 10000

# Back to the list
- back
- extendedWaitUntil:
    visible:
      id: "node-card-${NODE_ID}"
    timeout: 10000
