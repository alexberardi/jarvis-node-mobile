appId: com.jarvis.nodemobile
name: Forced password change after a temporary password
# Set a New Password (src/screens/Auth/ForcePasswordChangeScreen.tsx): an account the
# superuser gave a temporary password signs in, is held on the forced-change screen (no
# way into the app), sets a new password, lands on Home, and deletes itself.
# The setup is an API call (subflows/temp-password-account.js): the app has no way to
# issue a temporary password.
tags:
  - auth
  - e2e
  - skip
properties:
  skip_reason: "needs AUTH_URL (jarvisd's auth API, as the host sees it) in the runner's flow environment to issue the temporary password; the runner (jarvis-server docs/decisions/2026-10-18-e2e-mobile-runner.md) passes none yet"
env:
  EMAIL: "test@jarvisautomation.io"
  PASSWORD: "DevPass123!"
---
- launchApp:
    clearState: true
- runScript: subflows/temp-password-account.js
- extendedWaitUntil:
    visible:
      id: "landing-login-button"
    timeout: 30000
- tapOn:
    id: "landing-login-button"
- tapOn:
    id: "email-input"
- inputText: ${output.tempEmail}
- tapOn:
    id: "password-input"
- inputText: ${output.tempPassword}
- tapOn:
    id: "login-button"

# Held on the forced-change screen
- extendedWaitUntil:
    visible:
      id: "force-new-password-input"
    timeout: 30000
- assertVisible:
    text: "Set a New Password"
- assertNotVisible:
    id: "settings-button"
# A mismatch keeps the button off
- tapOn:
    id: "force-new-password-input"
- inputText: ${PASSWORD}
- tapOn:
    id: "force-confirm-password-input"
- inputText: "not-the-same-1"
- hideKeyboard
- assertVisible:
    id: "force-password-submit"
    enabled: false
- runFlow:
    file: subflows/clear-field.yaml
    env:
      FIELD_ID: "force-confirm-password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "force-password-submit"

# In the app with the new password
- extendedWaitUntil:
    visible:
      id: "settings-button"
    timeout: 30000
- runFlow: subflows/delete-account.yaml
