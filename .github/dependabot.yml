# Dependency updates. Added 2026-07-14: the project had no Dependabot,
# no lockfile audit, and no automated pin bumps — a reviewer on the launch
# thread correctly called that out.
#
# github-actions is the one that matters most here: third-party actions were
# floating on tags in jobs that hold packages:write, so a tag repoint could
# run attacker code with a token that can publish images.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Expo-SDK-managed + React Native native modules: their versions are pinned
    # to the Expo SDK and MUST be bumped via `npx expo install` (an SDK upgrade),
    # NOT by dependabot. An off-SDK bump compiles fine but crashes the RELEASE
    # build at native-module init (black screen) — expo-network 8->57 and
    # @react-native-async-storage 2->3 both did exactly that. Leave the whole
    # native/SDK surface to `expo install`.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-navigation/*"
      # The test/build toolchain is pinned to the Expo SDK too: jest-expo 54 is
      # built on Jest 29, babel-preset-expo tracks the SDK, and Expo pins
      # TypeScript ~5.9. Majors come in with an SDK upgrade; minors still flow.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Expo pins @types/react to the SDK's React minor (~19.1 for SDK 54);
      # `npx expo install --check` flags anything newer.
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
